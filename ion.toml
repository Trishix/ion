schema_version = 1
default_profile = "groq-qwen-dev"

[profiles.groq-qwen-dev]
provider = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "qwen/qwen3.8-27b"
api_key_env = "GROQ_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 131072
max_output_tokens = 4096

[profiles.openrouter-qwen-free]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.8-27b:free"
api_key_env = "OPENROUTER_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 262144
max_output_tokens = 4096

[profiles.openrouter-deepseek-free]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-v4-flash-0731:free"
api_key_env = "OPENROUTER_API_KEY"
protocol = "openai_chat"
tool_protocol = "structured_json"
text_only = true
locked = false
context_window = 1048576
max_output_tokens = 4096

[model_catalog]
allow_runtime_discovery = true
cache_ttl_seconds = 300
require_text = true
require_tools = true

[profiles.deepseek-direct]
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 1048576
max_output_tokens = 4096

[profiles.qwen-direct]
provider = "qwen"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
protocol = "openai_chat"
tool_protocol = "native"
text_only = true
locked = false
context_window = 131072
max_output_tokens = 4096
